name: PullBowPlugin
version: 1.0
main: com.pullbow.plugin.PullBowPlugin
api-version: 1.21
author: YourName
description: A plugin that adds a special Pull Bow that drags hit players to the shooter

commands:
  getpullbow:
    description: Get a Pull Bow (OP only)
    usage: /getpullbow
    permission: pullbow.get
    permission-message: You must be a server operator to use this command!

permissions:
  pullbow.get:
    description: Allows player to get a Pull Bow
    default: op
